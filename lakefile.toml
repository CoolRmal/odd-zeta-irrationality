name = "OddZeta"
version = "0.1.0"
defaultTargets = ["OddZeta", "Challenge", "Solution", "Challenge6r", "Solution6r"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "3cb72cfd416d1b5ec4b930d67648ef036a5df24f"

[[lean_lib]]
name = "OddZeta"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Challenge6r"

[[lean_lib]]
name = "Solution6r"
